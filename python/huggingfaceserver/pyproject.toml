[project]
authors = [
    {name = "Dan Sun", email = "dsun20@bloomberg.net"},
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.14"
dependencies = [
    "kserve[llm] @ file:///${PROJECT_ROOT}/../kserve",
    "kserve-storage @ file:///${PROJECT_ROOT}/../storage",
    "vllm[runai,tensorizer,fastsafetensors]>=0.19.0.dev0",
    "transformers>=5.5.4",
    "accelerate<2.0.0,>=1.6.0",
    "bitsandbytes>=0.45.3",
    "modelscope<2.0.0,>=1.16.0",
    "setuptools>=70.0.0",
]
name = "huggingfaceserver"
version = "0.17.0"
description = "Model Server implementation for huggingface. Not intended for use outside KServe Frameworks Images."
readme = "README.md"

[dependency-groups]
test = [
    "pytest<8.0.0,>=7.4.4",
    "pytest-cov<6.0.0,>=5.0.0",
    "mypy<1.0,>=0.991",
    "pytest-asyncio<1.0.0,>=0.23.4",
    "pytest-httpx<1.0.0,>=0.30.0",
    "einops<1.0.0,>=0.8.0",
    "openai>=1.59.9",
]
dev = [
    "black[colorama]~=24.3.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
# Override vllm's transformers<5 constraint to allow Transformers 5.x (required for qwen3_5 support)
override-dependencies = ["transformers>=5.5.4"]

[[tool.uv.index]]
name = "vllm-nightly"
url = "https://wheels.vllm.ai/nightly"

[tool.uv.sources]
vllm = { index = "vllm-nightly" }
